<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Calm systems. Clear delivery.</title>
  <desc id="desc">Santiago Molina's violet identity with three connected, layered interface panels.</desc>
  <!-- Colors from @santi020k/theme: theme-bg, surface, line, ink, ink-soft, brand, accent. -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="hsl(260, 30%, 12%)"/>
      <stop offset="1" stop-color="hsl(260, 43%, 8%)"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="hsl(264, 90%, 68%)"/>
      <stop offset="1" stop-color="hsl(264, 90%, 58%)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="hsl(260, 15%, 30%)" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#surface)"/>
