name: Profile maintenance

on:
  schedule:
    # Weekly is enough for the profile and avoids two daily runners.
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-maintenance
  cancel-in-progress: false

jobs:
  update:
    name: Update profile content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Update latest writing
        id: medium
        continue-on-error: true
        run: python .github/scripts/update_medium_posts.py

      - name: Commit profile changes
        if: steps.medium.outcome == 'success'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update latest Medium posts"
          git push

      - name: Generate contribution snake
        id: snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: santi020k
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ffffff&color_dots=#1a1a1a,#333333,#555555,#888888,#ffffff
            dist/github-contribution-grid-snake-dark.svg?color_snake=ffffff&color_dots=#1a1a1a,#333333,#555555,#888888,#ffffff

      - name: Publish contribution snake
        if: steps.snake.outcome == 'success'
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Medium update failure
        if: steps.medium.outcome == 'failure'
        run: |
          echo 'The Medium update failed after the contribution snake was handled.' >&2
          exit 1
