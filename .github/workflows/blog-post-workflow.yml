name: Latest blog posts

on:
  schedule:
    # Runs every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_medium_posts.py'

permissions:
  contents: read

concurrency:
  group: profile-writing
  cancel-in-progress: false

jobs:
  update-readme-with-blog:
    name: Update README with latest Medium posts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check profile automation
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Refresh reading list
        run: python .github/scripts/update_medium_posts.py

      - name: Commit changes
        run: |
          git config --local user.email "blog-post-bot@users.noreply.github.com"
          git config --local user.name "blog-post-bot"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update latest Medium posts"
          git push
